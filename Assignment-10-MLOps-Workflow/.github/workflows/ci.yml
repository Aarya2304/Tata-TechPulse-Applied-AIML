name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: pytest -q

      - name: Validate application imports
        run: python -c "from src.app import app; print('app import OK:', app.title)"

      - name: Train a smoke model (lightweight CI training validation)
        run: python -m src.train --smoke

      - name: Verify training artifacts exist
        run: |
          test -f artifacts/model_metadata.json
          test -f artifacts/model_metrics.json
          # MLflow 3 stores each experiment under mlruns/<experiment-id>/.
          find mlruns -maxdepth 3 -name meta.yaml | grep -q .
